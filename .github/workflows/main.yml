name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create app folder & dummy google-services.json
      run: |
        mkdir -p app
        echo '{"project_info":{"project_number":"1234567890","project_id":"dummy-ludo","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890","android_client_info":{"package_name":"com.aistudio.ludoclassic.kmr"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly"}]}]}' > app/google-services.json

    - name: Make gradlew executable
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        fi

    - name: Build Debug APK (Force Clean)
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug --continue -x check -x processDebugGoogleServices --stacktrace
        else
          gradle assembleDebug --continue -x check -x processDebugGoogleServices --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
