name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Project
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android Project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          find . -name "settings.gradle" -o -name "settings.gradle.kts"

          echo "Searching for Gradle Wrapper..."

          find . -name "gradlew" -type f

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          WRAPPER=$(find . -name "gradlew" -type f | head -n 1)

          if [ -n "$WRAPPER" ]; then
            echo "Gradle Wrapper found: $WRAPPER"
            chmod +x "$WRAPPER"
          else
            echo "No Gradle Wrapper found."
            echo "Using installed Gradle instead."
          fi

      - name: Build APK
        shell: bash
        run: |
          WRAPPER=$(find . -name "gradlew" -type f | head -n 1)

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR=$(dirname "$WRAPPER")
            cd "$PROJECT_DIR"

            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Android Gradle project not found."
              exit 1
            fi

            cd "$(dirname "$PROJECT_DIR")"
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find . -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: King-Mistry-Ludo-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
