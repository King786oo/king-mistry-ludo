name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Wrapper and Build Safely
      run: |
        # Check files in root directory to locate gradle files
        ls -la
        
        # If gradle wrapper does not exist, create it cleanly
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.10.2
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
