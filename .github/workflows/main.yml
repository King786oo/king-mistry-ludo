name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Fix gradlew Permission
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
        elif [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          echo "Gradlew wrapper not in root, checking subfolders..."
          find . -name "gradlew" -exec chmod +x {} \;
        fi

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon
        else
          mvn clean install || gradle assembleDebug --no-daemon
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: King_Mistry_Ludo_v59.1_Release
        path: |
          **/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/app-debug.apk
